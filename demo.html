<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ColorPicker demo</title>
  <link rel="stylesheet" href="./colorPicker.css">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; padding: 48px 24px; background: #0c0e12; color: #f4f5f7; }
    main { width: min(720px, 100%); margin: 0 auto; }
    .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    button { padding: 10px 16px; border: 0; border-radius: 9px; background: #4357b4; color: white; cursor: pointer; }
    .swatch { width: 42px; height: 42px; border: 1px solid #3b3f49; border-radius: 10px; background: #4357b4; }
    #mount { position: relative; min-height: 430px; margin-top: 20px; }
    #mount > .oe-color-dropdown { position: static; transform: none; }
    code { color: #aab7ff; }
  </style>
</head>
<body data-status="running">
  <main>
    <h1>@shelamkoff/color-picker</h1>
    <p>Open the picker, change the color or format, and apply or remove the value.</p>
    <div class="row">
      <button id="open" type="button">Open picker</button>
      <span class="swatch" id="swatch" aria-hidden="true"></span>
      <code id="value">#4357b4</code>
    </div>
    <div id="mount"></div>
  </main>

  <script type="module">
    import { ColorPicker } from './index.js'

    const mount = document.querySelector('#mount')
    const swatch = document.querySelector('#swatch')
    const value = document.querySelector('#value')

    const update = color => {
      value.textContent = color
      swatch.style.background = color
    }

    const picker = new ColorPicker({
      onChange: update,
      onApply: update,
      onRemove: () => update('transparent'),
    })
    mount.append(picker.element)

    const open = () => picker.open(value.textContent === 'transparent' ? '#4357b4' : value.textContent)
    document.querySelector('#open').addEventListener('click', open)
    open()

    if (!(picker.element instanceof HTMLElement)) throw new Error('ColorPicker demo failed to mount')
    document.body.dataset.status = 'pass'
  </script>
</body>
</html>
